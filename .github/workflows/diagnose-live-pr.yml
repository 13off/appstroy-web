name: Diagnose live AppСтрой startup

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  live-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Verify live assets
        shell: bash
        run: |
          set -euxo pipefail
          URL='https://13off.github.io/appstroy-web/'
          curl --fail --show-error --location --retry 5 --retry-all-errors --dump-header live-headers.txt "$URL" --output live-index.html
          curl --fail --show-error --location --retry 5 --retry-all-errors "${URL}flutter_bootstrap.js" --output live-flutter_bootstrap.js
          curl --fail --show-error --location --retry 5 --retry-all-errors "${URL}main.dart.js" --output live-main.dart.js
          curl --fail --show-error --location --retry 5 --retry-all-errors "${URL}flutter_service_worker.js" --output live-service-worker.js
          curl --fail --show-error --location --retry 5 --retry-all-errors "${URL}downloads/web-source-commit.txt" --output live-source-commit.txt
          wc -c live-index.html live-flutter_bootstrap.js live-main.dart.js live-service-worker.js live-source-commit.txt
          cat live-source-commit.txt
          grep -n 'flutter_bootstrap.js' live-index.html
          grep -q 'appstroy-recovery-20260803-1' live-service-worker.js

      - name: Install browser diagnostic client
        shell: bash
        run: npm install --no-save puppeteer-core@24

      - name: Open live app as iPhone
        shell: bash
        run: |
          cat > diagnose.mjs <<'NODE'
          import puppeteer from 'puppeteer-core';
          import fs from 'node:fs';

          const browser = await puppeteer.launch({
            executablePath: '/usr/bin/google-chrome',
            headless: true,
            args: ['--no-sandbox', '--disable-dev-shm-usage'],
          });
          const page = await browser.newPage();
          await page.setViewport({ width: 390, height: 844, deviceScaleFactor: 1 });
          await page.setUserAgent('Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1');

          const events = [];
          const add = (kind, value) => {
            const line = `[${kind}] ${value}`;
            events.push(line);
            console.log(line);
          };
          page.on('console', message => add(`console:${message.type()}`, message.text()));
          page.on('pageerror', error => add('pageerror', error.stack || error.message));
          page.on('requestfailed', request => add('requestfailed', `${request.url()} :: ${request.failure()?.errorText}`));
          page.on('response', response => {
            if (response.status() >= 400) add('http', `${response.status()} ${response.url()}`);
          });

          let navigationError = null;
          try {
            await page.goto(`https://13off.github.io/appstroy-web/?live_diag=${Date.now()}`, {
              waitUntil: 'domcontentloaded',
              timeout: 60000,
            });
            await new Promise(resolve => setTimeout(resolve, 18000));
          } catch (error) {
            navigationError = error.stack || String(error);
            add('navigation', navigationError);
          }

          const state = await page.evaluate(() => ({
            href: location.href,
            title: document.title,
            readyState: document.readyState,
            bodyText: document.body?.innerText ?? '',
            bodyHtmlLength: document.body?.innerHTML.length ?? -1,
            canvases: document.querySelectorAll('canvas').length,
            flutterViews: document.querySelectorAll('flutter-view').length,
            fltGlassPanes: document.querySelectorAll('flt-glass-pane').length,
            scripts: [...document.scripts].map(script => script.src || '<inline>'),
            serviceWorkerController: navigator.serviceWorker?.controller?.scriptURL ?? null,
          }));

          fs.writeFileSync('browser-state.json', JSON.stringify({ navigationError, state, events }, null, 2));
          await page.screenshot({ path: 'live-mobile.png', fullPage: true });
          console.log(JSON.stringify(state, null, 2));
          await browser.close();

          const fatalEvents = events.filter(line =>
            line.startsWith('[pageerror]') ||
            line.startsWith('[requestfailed]') ||
            line.startsWith('[http]') ||
            line.startsWith('[navigation]')
          );
          const flutterMounted = state.flutterViews > 0 || state.canvases > 0 || state.fltGlassPanes > 0;
          if (navigationError || fatalEvents.length > 0 || !flutterMounted) {
            process.exitCode = 2;
          }
          NODE
          node diagnose.mjs

      - name: Upload live diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-appstroy-startup-diagnosis
          path: |
            live-headers.txt
            live-index.html
            live-flutter_bootstrap.js
            live-service-worker.js
            live-source-commit.txt
            browser-state.json
            live-mobile.png
          if-no-files-found: warn
